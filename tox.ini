# Multi-version test matrix, driven by uv (tox-uv). Each env provisions its own Python
# via uv and runs the suite, so `tox` locally mirrors what CI does across versions.
#
#   uv run tox            # all versions the machine has
#   uv run tox -e py312   # one version
#
# `requires-python = ">=3.11"`, so we cover 3.11 / 3.12 / 3.13.
[tox]
requires =
    tox>=4.11
    tox-uv>=1.11
env_list = py311, py312, py313

[testenv]
runner = uv-venv-lock-runner
with_dev = true
# VECLIB_MAXIMUM_THREADS caps Accelerate's pool so a forked test runner on Apple Silicon
# does not segfault in BLAS (see README); harmless elsewhere.
set_env =
    VECLIB_MAXIMUM_THREADS = 1
commands = pytest -q
