# Optional native accelerator for fastumap: a Rust reimplementation of the SGD layout
# kernel, built as a Python extension module with PyO3 + maturin. The base `fastumap`
# package stays pure numpy+scipy; when this module is importable, layout.py uses it.
#
# Build (dev):   maturin develop --release      (from this directory, into the venv)
# Build wheels:  maturin build --release         (x86_64 + aarch64 via --zig for Graviton)
[package]
name = "fastumap"
version = "0.2.0"
edition = "2021"
description = "Native SGD + k-means kernels for fastumap (built into the package)."
license = "MIT"

[lib]
# Built by maturin as the `fastumap._accel` submodule of the merged package (was the separate
# fastumap-accel wheel). See [tool.maturin] in the root pyproject.toml.
name = "_accel"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311: build against Python's stable ABI so ONE wheel works on 3.11 and every later
# version (3.12, 3.13, 3.14, ...) — no per-version rebuild. extension-module lets it link
# as a Python extension without linking libpython.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
# Data-parallel k-means assignment (the O(n*k*d) hot loop). A pure-Rust crate compiled into the
# wheel — no external/system library, consistent with "implement it, don't collect libraries".
rayon = "1"
# Pure-Rust SIMD GEMM (no external BLAS): the k-means assignment is X @ centroidsᵀ, and a naive
# triple loop is ~18x too slow at 1M. matrixmultiply gives BLAS-ish throughput while keeping the
# wheel self-contained.
matrixmultiply = "0.3"

[profile.release]
opt-level = 3
lto = true
