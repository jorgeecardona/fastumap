# fastumap CI/CD.
#
# fastumap is a maturin-built package: the pure-Python src/fastumap/ plus a compiled Rust
# extension (fastumap._accel — the SGD + k-means kernels) shipped in the SAME wheel. So the build
# needs a Rust toolchain, and "publish" ships abi3 wheels (x86_64 + aarch64) plus an sdist, all
# under the single `fastumap` project. There is no separate fastumap-accel package any more.
#
# proto installs the pinned moon + uv (.prototools); one `moon run :ci` orchestrates the check
# graph (lint, format, typecheck, test, version-guard). The job then builds the wheels with
# maturin and, on the default branch, publishes dist/* to PyPI via OIDC Trusted Publishing when
# pyproject's version isn't on PyPI yet (idempotent — a no-op on every other main pipeline). The
# PyPI pending publisher is configured. See README "Releasing".

default:
  image: debian:bookworm-slim

variables:
  UV_LINK_MODE: copy
  # version-guard diffs against a base older than a shallow clone would contain.
  GIT_DEPTH: "0"

# Avoid duplicate (branch + MR) pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

ci:
  # Scheduled pipelines run the `nightly` job only — re-running the gate and the publish every
  # night buys nothing (scripts/release is a no-op once the version is on PyPI).
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  # OIDC Trusted Publishing: GitLab mints a short-lived id_token; scripts/pypi-publish exchanges
  # it for a one-shot PyPI token. The `pypi` environment matches the PyPI publisher config.
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: pypi
    url: https://pypi.org/project/fastumap/
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .venv
  before_script:
    # debian-slim is bare: proto + pyright's bundled node (libatomic1) need these; build-essential
    # + rustup give the Rust toolchain maturin compiles fastumap._accel with.
    - apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates unzip xz-utils bash libatomic1 build-essential
    - export PATH="$HOME/.proto/bin:$HOME/.proto/shims:$PATH"
    # Fetch proto straight from its GitHub release (moonrepo.dev is flaky from CI).
    - mkdir -p "$HOME/.proto/bin" /tmp/proto && curl -fsSL "https://github.com/moonrepo/proto/releases/latest/download/proto_cli-x86_64-unknown-linux-gnu.tar.xz" -o /tmp/proto/p.tar.xz && tar xf /tmp/proto/p.tar.xz --strip-components 1 -C /tmp/proto && mv /tmp/proto/proto /tmp/proto/proto-shim "$HOME/.proto/bin/" && rm -rf /tmp/proto
    - proto install                       # moon + uv, pinned in .prototools
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    - rustup target add x86_64-unknown-linux-gnu    # explicit: the zig manylinux2014 build below
    - rustup target add aarch64-unknown-linux-gnu   # Graviton / ARM
    - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl   # Alpine / musl libc
    - uv sync --frozen                    # builds fastumap (+ its _accel) via maturin, plus test deps
  script:
    - export PATH="$HOME/.proto/bin:$HOME/.proto/shims:$PATH"
    - . "$HOME/.cargo/env"
    # The check graph: lint, format, typecheck, test, version-guard. The test task runs the full
    # suite against the installed package, so the native _accel path is exercised too.
    - moon run :ci -c 1
    # Install maturin + ziglang AFTER the check graph: `moon run` drives `uv run`, which re-syncs
    # the venv to the lock and would evict these (they are not in the lock). ziglang is maturin's
    # cross-linker for the --zig aarch64 build. Nothing below re-syncs before the builds run.
    - uv pip install maturin ziglang
    # Put the venv first on PATH: maturin's `--zig` finds the zig linker by running `python3 -m
    # ziglang`, and that python3 must be the venv one (which has ziglang), not the system python.
    # Without this the aarch64 cross-compile fails with "Failed to find zig".
    - export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
    # Build the abi3 wheels + sdist with maturin (cp311-abi3 = one wheel per arch for Python 3.11+).
    # x86_64 goes through zig like the aarch64 build below, so the wheel targets glibc 2.17
    # (manylinux2014) instead of the builder image's own 2.36 (manylinux_2_34, which locked out
    # Ubuntu 20.04, Amazon Linux 2 and older CentOS and sent them to the sdist + a Rust toolchain).
    # Falls back to the native build, so a zig flake still ships an x86_64 wheel, just with the
    # narrower glibc floor it had before.
    - .venv/bin/maturin build --release --zig --target x86_64-unknown-linux-gnu --compatibility manylinux2014 -m rust/Cargo.toml -o dist || .venv/bin/maturin build --release -m rust/Cargo.toml -o dist
    # aarch64/Graviton via zig cross-compile. Best-effort: an ARM cross-compile flake must NOT
    # block the x86_64 + sdist publish below.
    - .venv/bin/maturin build --release --zig --target aarch64-unknown-linux-gnu -m rust/Cargo.toml -o dist || echo "aarch64 cross-compile failed; publishing x86_64 + sdist only"
    # musllinux (Alpine / musl libc) via zig, x86_64 + aarch64. Best-effort like the aarch64 gnu
    # build: a musl cross flake must not block the manylinux publish. Lets `pip install fastumap`
    # work on python:*-alpine images with no compiler.
    - .venv/bin/maturin build --release --zig --target x86_64-unknown-linux-musl -m rust/Cargo.toml -o dist || echo "musllinux x86_64 cross-compile failed"
    - .venv/bin/maturin build --release --zig --target aarch64-unknown-linux-musl -m rust/Cargo.toml -o dist || echo "musllinux aarch64 cross-compile failed"
    # Source dist so macOS / Windows / other arches can build+install with a Rust toolchain.
    - .venv/bin/maturin sdist -m rust/Cargo.toml -o dist
    # On main: publish dist/* to PyPI via OIDC (idempotent — a no-op if this version is already up).
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        sh scripts/release
      fi
  artifacts:
    paths:
      - dist

# Run a fast, version-sensitive subset on Python 3.11 / 3.12 / 3.13 (uv provisions each
# interpreter, tox-uv drives it) so version-specific breakage is caught. Kept to a subset because
# the full suite 3x would overwhelm the memory-limited runner; `make tox` locally runs everything.
# Needs Rust because installing fastumap now compiles the extension. Hard gate.
test-matrix:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"   # `nightly` covers all three versions in full
      when: never
    - when: on_success
  variables:
    UV_LINK_MODE: copy
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git libatomic1 build-essential curl ca-certificates
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    - uv python install 3.11 3.12 3.13
    - uv sync --frozen
  script:
    - . "$HOME/.cargo/env"
    - uv run tox -- tests/test_projection.py tests/test_find_ab_params.py tests/test_no_heavy_deps.py tests/test_version.py tests/test_import_cost.py

# The FULL tox matrix (every test x 3.11/3.12/3.13), on a schedule instead of on every push.
# test-matrix above is deliberately a subset: the full suite three times is too slow and too
# memory-hungry for the shared runner to carry on each commit. A nightly can afford it, so
# version-specific breakage outside that subset is caught the next day instead of at a release.
# Runs ONLY on a schedule (Settings > CI/CD > Pipeline schedules, or `glab schedule list`).
nightly:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  needs: []
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    UV_LINK_MODE: copy
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git libatomic1 build-essential curl ca-certificates
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    - uv python install 3.11 3.12 3.13
    - uv sync --frozen
  script:
    - . "$HOME/.cargo/env"
    - uv run tox        # no posargs: the whole suite, on all three interpreters


# Windows x86_64 abi3 wheel, so `pip install fastumap` needs no Rust toolchain on Windows.
#
# GitLab's hosted Windows runners are available on the Free plan (cost factor 1, same rate as
# Linux small), unlike the macOS ones which are Premium/Ultimate only — see the macOS+Windows
# wheels issue in docs/issues for that half.
#
# Not a Docker executor: no `image:` key is allowed, and the shell is PowerShell. Python 3.13 is
# preinstalled on the image; Rust is NOT, so rustup-init runs here.
#
# Best-effort like the aarch64 and musllinux cross-builds: a Windows flake must never block the
# Linux publish, so `allow_failure: true`. It publishes its own wheel rather than handing an
# artifact to `ci` — PyPI accepts extra files on an existing version, and `twine --skip-existing`
# makes a re-run a no-op instead of a 400.
wheels-windows:
  tags:
    - saas-windows-medium-amd64
  needs: []
  allow_failure: true
  #
  # Only when pyproject.toml changed, i.e. on a release. MEASURED: this job takes ~10.5 min per
  # run, and a Free namespace gets 400 compute minutes a month — on every push it would eat the
  # whole quota in about 36 pushes, for a wheel that only matters when a version is published.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - pyproject.toml
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: pypi
    url: https://pypi.org/project/fastumap/
  script:
    - $ErrorActionPreference = "Stop"
    # Rust is not on the Windows image; rustup-init is the documented way in.
    - Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain stable
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
    - rustc --version
    - python -m pip install --quiet --upgrade pip maturin twine
    # cp311-abi3: one wheel covers Python 3.11+, same as every other platform here.
    - python -m maturin build --release -m rust/Cargo.toml -o dist
    - Get-ChildItem dist
    # Mint a one-shot PyPI token from the job's OIDC id_token, same exchange as
    # scripts/pypi-publish does on Linux (that script is /bin/sh and cannot run here).
    - |
      $body = @{ token = $env:PYPI_ID_TOKEN } | ConvertTo-Json -Compress
      $resp = Invoke-RestMethod -Method Post -Uri https://pypi.org/_/oidc/mint-token -ContentType 'application/json' -Body $body
      $env:TWINE_USERNAME = '__token__'
      $env:TWINE_PASSWORD = $resp.token
      python -m twine upload --skip-existing --non-interactive dist/*.whl
  artifacts:
    paths:
      - dist
    expire_in: 1 week

# Docs site -> GitLab Pages, main only. mkdocstrings reads src/fastumap statically (griffe), so
# this job never installs fastumap and never needs a Rust toolchain: --no-install-project keeps
# the sync to the docs extra alone, --no-sync stops `uv run` putting the project back. Builds in
# seconds. `--strict` fails the job on a broken cross-link rather than publishing one.
pages:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    UV_LINK_MODE: copy
  script:
    - uv sync --frozen --extra docs --no-install-project
    - uv run --no-sync mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
