# fastumap CI/CD -- a single moon-driven job.
#
# proto installs the pinned toolchain (.prototools: moon + uv); then ONE `moon run`
# orchestrates the whole task graph (lint, format, typecheck, test, build, version-guard)
# -- no per-language jobs, moon resolves the order. On the default branch it runs
# `:release` (the same `:ci` checks as deps, then publishes to PyPI via OIDC Trusted
# Publishing when the version isn't on PyPI yet) -- BUT only once the PyPI publisher is
# configured and the CI/CD variable PYPI_READY=1 is set. Until then main runs `:ci`,
# so the first pipelines are green without a PyPI account. See README "Releasing".

default:
  image: debian:bookworm-slim

variables:
  UV_LINK_MODE: copy
  # version-guard diffs against a base older than a shallow clone would contain.
  GIT_DEPTH: "0"

# Avoid duplicate (branch + MR) pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

ci:
  # OIDC Trusted Publishing: GitLab mints a short-lived id_token; scripts/pypi-publish
  # exchanges it for a one-shot PyPI token. The `pypi` environment matches the PyPI
  # publisher config.
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: pypi
    url: https://pypi.org/project/fastumap/
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .venv
  before_script:
    # debian-slim is bare: bring what proto + pyright's bundled node (libatomic1) need.
    - apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates unzip xz-utils bash libatomic1
    - export PATH="$HOME/.proto/bin:$HOME/.proto/shims:$PATH"
    # Fetch proto straight from its GitHub release (moonrepo.dev is flaky from CI).
    - mkdir -p "$HOME/.proto/bin" /tmp/proto && curl -fsSL "https://github.com/moonrepo/proto/releases/latest/download/proto_cli-x86_64-unknown-linux-gnu.tar.xz" -o /tmp/proto/p.tar.xz && tar xf /tmp/proto/p.tar.xz --strip-components 1 -C /tmp/proto && mv /tmp/proto/proto /tmp/proto/proto-shim "$HOME/.proto/bin/" && rm -rf /tmp/proto
    - proto install                       # moon + uv, pinned in .prototools
    - uv sync --frozen                    # ruff + pyright + pytest + test deps
  script:
    - export PATH="$HOME/.proto/bin:$HOME/.proto/shims:$PATH"
    # main + PYPI_READY=1 -> full release (checks then publish-if-new). Otherwise checks only.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ "${PYPI_READY:-0}" = "1" ]; then
        moon run :release -c 1
      else
        moon run :ci -c 1
      fi

# Publish the docs to GitLab Pages. main only; independent of `ci`.
pages:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - uv sync --frozen --extra docs
    - uv run mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  allow_failure: true
