# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# fastumap — numba-free UMAP. Single project at the repo root. Every task runs as a
# system command via `uv run` (see .moon/toolchain.yml). CI runs one `moon run :ci`
# (or `:release` on main); moon owns all task ordering.
id: 'fastumap'
layer: 'library'
language: 'python'

tasks:
  lint:
    command: 'uv run ruff check src tests bench'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'bench/**/*.py', 'pyproject.toml']

  format-check:
    command: 'uv run ruff format --check src tests bench'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'bench/**/*.py', 'pyproject.toml']

  typecheck:
    command: 'uv run pyright'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'bench/**/*.py', 'pyproject.toml']

  test:
    # --cov measures library coverage and fails under the pyproject [tool.coverage] floor (90%).
    command: 'uv run pytest --cov=fastumap --cov-report=term-missing'
    # rust/** is an input: the compiled kernel is part of the package, so a Rust change must
    # re-run the suite (uv sync rebuilds fastumap._accel via maturin).
    inputs: ['src/**/*.py', 'tests/**/*.py', 'rust/**/*.rs', 'rust/Cargo.toml', 'pyproject.toml']

  build:
    command: 'uv build --out-dir dist'
    deps: ['~:test']
    inputs: ['src/**/*.py', 'rust/**/*.rs', 'rust/Cargo.toml', 'pyproject.toml', 'README.md', 'LICENSE']
    outputs: ['dist']

  # CI-side enforcement of "a src/ change carries a version bump".
  version-guard:
    command: 'sh scripts/ci-version-guard'
    options:
      cache: false

  # The single aggregate gate: the whole CI check graph in one target. The wheel build is NOT a
  # dep here — the CI job builds the maturin wheels (x86_64 + aarch64 + sdist) explicitly in its
  # script, on every branch, so a build break is still caught.
  ci:
    command: 'noop'
    deps:
      - '~:lint'
      - '~:format-check'
      - '~:typecheck'
      - '~:test'
      - '~:version-guard'

  # Mint a PyPI OIDC token and upload dist/*. Invoked by release (or by hand).
  publish:
    command: 'sh scripts/pypi-publish'
    deps: ['~:build']
    options:
      cache: false
      runInCI: false

  # main-only: no-op if pyproject's version is already on PyPI; else publish.
  release:
    command: 'sh scripts/release'
    deps: ['~:ci']
    options:
      cache: false
