[project]
# fastumap — a numba-free UMAP. The reason it exists is import cost: umap-learn's
# kernels are numba, which compiles with LLVM at import time (~4s CPU, 172MB of wheels).
# fastumap is pure numpy+scipy, which ship precompiled kernels and import in milliseconds.
name = "fastumap"
version = "0.1.11"
description = "A numba-free UMAP in pure numpy + scipy: imports in milliseconds, no LLVM/JIT at runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = [
    "umap",
    "dimensionality-reduction",
    "manifold-learning",
    "embedding",
    "visualization",
    "numpy",
    "scipy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# docs are an *extra* (installable via pip) so GitLab Pages / RTD can build them.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://gitlab.com/jorgeecardona/fastumap"
Repository = "https://gitlab.com/jorgeecardona/fastumap"
Changelog = "https://gitlab.com/jorgeecardona/fastumap/-/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastumap"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
# The grading harness compares us against umap-learn; scikit-learn supplies datasets
# and PCA baselines; psutil measures peak RSS. None of these are runtime deps — a test
# asserts umap/numba are never imported by `import fastumap`.
dev = [
    "ruff>=0.6",
    "pyright>=1.1.390",
    "pytest>=8",
    "umap-learn>=0.5",
    "scikit-learn>=1.3",
    "psutil>=5.9",
    "tox>=4.11",
    "tox-uv>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fastumap"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# scipy / scikit-learn / umap-learn ship no type stubs; you cannot type-check against
# a library that publishes none, so we stop demanding them. This does not hide misuse
# of those libraries (attribute/arg errors still fire), only the "no stubs" complaint.
reportMissingTypeStubs = false
# numpy 2.x stubs type many array results as `floating[Any]` / `ndarray[Any]`
# (np.where with a scalar branch, np.einsum, np.linspace, ...). Under strict, that
# trips reportUnknown*Type on ~every numeric line even though the code is correct
# and fully annotated at every boundary. We keep the rest of strict (it still catches
# real errors: bad attributes, arg counts, None-safety, missing returns, incompatible
# assignments) and disable only the three "value's type is partially Any" reports.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
