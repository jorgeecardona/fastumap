[project]
# fastumap — fast, import-light UMAP and clustering. umap-learn's kernels are numba, which
# compiles with LLVM the first time you import it (seconds on a laptop, minutes on a small box);
# fastumap compiles at BUILD time instead, so it imports in milliseconds. Mostly numpy + scipy,
# with native SGD/k-means kernels (fastumap._accel) built into the wheel by maturin.
name = "fastumap"
version = "0.2.26"
description = "UMAP and clustering with no JIT at import, for serverless and CPU-limited containers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = [
    "umap",
    "dimensionality-reduction",
    "manifold-learning",
    "embedding",
    "visualization",
    "numpy",
    "scipy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # Pure-Python (no compiled code). Used only to cap BLAS threads to the container's CPU
    # quota on a throttled host, so an oversubscribed thread pool can't thrash under load;
    # imported lazily, so import cost and unconstrained-host runs are unaffected.
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
# The native SGD + k-means kernels are now built into the package (fastumap._accel); there is no
# separate fastumap-accel install any more.
# `pip install fastumap[ann]` adds an approximate kNN backend for inputs above ~10k points,
# where the exact O(n^2) kNN dominates. faiss-cpu (Meta) is HNSW under the hood and — unlike
# hnswlib, which is sdist-only and compiles on the machine — ships abi3 wheels for manylinux
# x86_64/aarch64, macOS, musllinux and Windows, so it installs without a compiler (which is the
# whole point of this library). The base install needs no ann backend; exact is the default.
ann = ["faiss-cpu>=1.8"]
# docs are an *extra* (installable via pip) so a docs site can build them.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # mkdocstrings formats generated signatures with ruff if it is present; without it the API
    # page prints them on one unwrapped line.
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://gitlab.com/jorgeecardona/fastumap"
Repository = "https://gitlab.com/jorgeecardona/fastumap"
Documentation = "https://fastumap-942a24.gitlab.io/"
Issues = "https://gitlab.com/jorgeecardona/fastumap/-/issues"
Changelog = "https://gitlab.com/jorgeecardona/fastumap/-/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[tool.maturin]
# Mixed layout: the Python package is src/fastumap/, and the Rust extension is built from
# rust/Cargo.toml as the fastumap._accel submodule and shipped in the same wheel. abi3, so one
# wheel per platform serves Python 3.11+.
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "fastumap._accel"
features = ["pyo3/extension-module"]

[dependency-groups]
# The grading harness compares us against umap-learn; scikit-learn supplies datasets
# and PCA baselines; psutil measures peak RSS. None of these are runtime deps — a test
# asserts umap/numba are never imported by `import fastumap`.
dev = [
    "ruff>=0.6",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "umap-learn>=0.5",
    "scikit-learn>=1.3",
    "psutil>=5.9",
    "tox>=4.11",
    "tox-uv>=1.11",
    "faiss-cpu>=1.8",   # exercise the approximate-kNN path (the fastumap[ann] backend) in tests
]

[tool.coverage.run]
source = ["fastumap"]
# grade.py is the `python -m fastumap.grade` CLI that prints the umap-learn comparison table —
# exercised by `make grade`, not the unit suite — so it is omitted from the library coverage gate.
omit = ["*/fastumap/grade.py"]

[tool.coverage.report]
show_missing = true
# 90% floor: below the current ~93.5% (library modules run 87–100%), so it has headroom and can be
# ratcheted up. Excludes the usual no-cover pragmas and the accel-absent numpy fallbacks (those
# branches can't run when the wheel carries the native kernel).
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fastumap"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# scipy / scikit-learn / umap-learn ship no type stubs; you cannot type-check against
# a library that publishes none, so we stop demanding them. This does not hide misuse
# of those libraries (attribute/arg errors still fire), only the "no stubs" complaint.
reportMissingTypeStubs = false
# numpy 2.x stubs type many array results as `floating[Any]` / `ndarray[Any]`
# (np.where with a scalar branch, np.einsum, np.linspace, ...). Under strict, that
# trips reportUnknown*Type on ~every numeric line even though the code is correct
# and fully annotated at every boundary. We keep the rest of strict (it still catches
# real errors: bad attributes, arg counts, None-safety, missing returns, incompatible
# assignments) and disable only the three "value's type is partially Any" reports.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
